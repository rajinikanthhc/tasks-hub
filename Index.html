<!DOCTYPE html>

<html>

<head>

  <base target="_top">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Tasks Hub</title>

  <?!= include('CSS'); ?>

</head>


<body>

<div class="app">


  <!-- HEADER -->

  <div class="topbar">

    <h1>Tasks</h1>

    <button
      class="addButton"
      onclick="openAddTask()">

      + Add Task

    </button>

  </div>


  <!-- SEARCH -->

  <div class="searchBox">

    <span>🔍</span>

    <input
      type="text"
      id="searchInput"
      placeholder="Search tasks..."
      oninput="filterTasks()">

    <button
      id="clearSearch"
      onclick="clearSearch()"
      style="display:none;">

      ×

    </button>

  </div>


  <!-- FILTER -->

  <div class="filters">

    <button
      id="allButton"
      class="filterButton active"
      onclick="setFilter('all')">

      All

    </button>


    <button
      id="pendingButton"
      class="filterButton"
      onclick="setFilter('pending')">

      Pending

    </button>


    <button
      id="completedButton"
      class="filterButton"
      onclick="setFilter('completed')">

      Completed

    </button>

  </div>


  <!-- TASK LIST -->

  <div id="taskList">

    <div class="loading">

      Loading tasks...

    </div>

  </div>


</div>


<!-- ADD / EDIT TASK POPUP -->

<div
  id="taskModal"
  class="modal">

  <div class="modalContent">


    <div class="modalHeader">

      <h2 id="modalTitle">

        Add Task

      </h2>


      <button
        class="closeButton"
        onclick="closeAddTask()">

        ×

      </button>

    </div>


    <label>

      Task

    </label>


    <input
      type="text"
      id="taskInput"
      placeholder="Enter task">


    <label>

      Due Date

    </label>


    <input
      type="date"
      id="dueDateInput">


    <button
      id="saveButton"
      class="saveButton"
      onclick="saveTask()">

      Save Task

    </button>


  </div>

</div>


<!-- MESSAGE -->

<div
  id="message"
  class="message">

</div>


<?!= include('JS'); ?>


</body>

</html>
