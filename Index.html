<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Visiting Cards Hub</title>

  <?!= include('CSS'); ?>

</head>

<body>

  <div class="app">

    <div class="topbar">

      <h1>Visiting Cards</h1>

      <button
        class="addButton"
        onclick="openAddCard()">
        + Add Card
      </button>

    </div>


    <input
      id="searchBox"
      type="text"
      placeholder="Search anything..."
      oninput="searchCards()"
      autocomplete="off"
    >


    <div id="results"></div>

  </div>


  <!-- ADD / EDIT CARD MODAL -->

  <div
    id="addCardModal"
    class="modal">

    <div class="modalContent">

      <div class="modalHeader">

        <h2 id="modalTitle">
          Add Visiting Card
        </h2>

        <button
          class="closeButton"
          onclick="closeAddCard()">
          ×
        </button>

      </div>


      <!-- ID - ONLY SHOWN WHILE EDITING -->

      <input
        id="cardId"
        placeholder="ID"
        readonly
        style="display:none;"
      >


      <!-- PHOTO -->

      <label class="photoLabel">
        Visiting Card Photo
      </label>

      <input
        id="imageFile"
        type="file"
        accept="image/png"
      >


      <div
        id="currentImage"
        class="currentImage">
      </div>


      <input
        id="name"
        placeholder="Name"
      >

      <input
        id="company"
        placeholder="Company"
      >

      <input
        id="designation"
        placeholder="Designation"
      >

      <input
        id="area"
        placeholder="Area"
      >

      <input
        id="mobile"
        placeholder="Mobile"
      >

      <input
        id="email"
        placeholder="Email"
      >

      <textarea
        id="notes"
        placeholder="Notes"></textarea>


      <button
        id="saveButton"
        class="saveButton"
        onclick="saveCard()">

        Save Card

      </button>

    </div>

  </div>


  <?!= include('JavaScript'); ?>

</body>

</html>
