<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Visiting Cards Hub</title>

  <?!= include('CSS'); ?>

</head>

<body>

  <div class="app">

    <div class="topbar">

      <h1>Visiting Cards</h1>

      <button
        class="addButton"
        onclick="openAddCard()">
        + Add Card
      </button>

    </div>


    <!-- SEARCH -->

    <input
      id="searchBox"
      type="text"
      placeholder="Search anything..."
      oninput="searchCards()"
      autocomplete="off"
    >


    <!-- RESULTS -->

    <div id="results"></div>

  </div>


  <!-- =================================
       ADD / EDIT CARD MODAL
  ================================= -->

  <div
    id="addCardModal"
    class="modal">

    <div class="modalContent">


      <!-- MODAL HEADER -->

      <div class="modalHeader">

        <h2 id="modalTitle">
          Add Visiting Card
        </h2>

        <button
          class="closeButton"
          onclick="closeAddCard()">

          ×

        </button>

      </div>


      <!-- =================================
           ID
           Hidden - Used During Edit
      ================================= -->

      <input
        id="cardId"
        type="text"
        placeholder="ID"
        readonly
        style="display:none;"
      >


      <!-- =================================
           PHOTO
           ACCEPT ANY IMAGE
      ================================= -->

      <label
        class="photoLabel"
        for="imageFile">

        Visiting Card Photo

      </label>


      <input
        id="imageFile"
        type="file"
        accept="image/*"
      >


      <!-- CURRENT IMAGE WHILE EDITING -->

      <div
        id="currentImage"
        class="currentImage">
      </div>


      <!-- =================================
           NAME
      ================================= -->

      <input
        id="name"
        type="text"
        placeholder="Name"
      >


      <!-- =================================
           COMPANY
      ================================= -->

      <input
        id="company"
        type="text"
        placeholder="Company"
      >


      <!-- =================================
           DESIGNATION
      ================================= -->

      <input
        id="designation"
        type="text"
        placeholder="Designation"
      >


      <!-- =================================
           AREA
      ================================= -->

      <input
        id="area"
        type="text"
        placeholder="Area"
      >


      <!-- =================================
           MOBILE
      ================================= -->

      <input
        id="mobile"
        type="text"
        placeholder="Mobile"
      >


      <!-- =================================
           EMAIL
      ================================= -->

      <input
        id="email"
        type="email"
        placeholder="Email"
      >


      <!-- =================================
           NOTES
      ================================= -->

      <textarea
        id="notes"
        placeholder="Notes">
      </textarea>


      <!-- =================================
           SAVE / UPDATE
      ================================= -->

      <button
        id="saveButton"
        class="saveButton"
        onclick="saveCard()">

        Save Card

      </button>


    </div>

  </div>


  <!-- =================================
       JAVASCRIPT
  ================================= -->

  <?!= include('JavaScript'); ?>


</body>

</html>
