<script>

let allCards = [];


/* =================================
   OPEN ADD CARD
================================= */

function openAddCard() {

  document
    .getElementById("addCardModal")
    .style.display = "flex";

}


/* =================================
   CLOSE ADD CARD
================================= */

function closeAddCard() {

  document
    .getElementById("addCardModal")
    .style.display = "none";

}


/* =================================
   SAVE CARD
================================= */

function saveCard() {

  const fileInput =
    document.getElementById("imageFile");

  const file =
    fileInput.files[0];


  if (!file) {

    alert("Please select a visiting card PNG image.");

    return;

  }


  const card = {

    Name:
      document.getElementById("name").value.trim(),

    Company:
      document.getElementById("company").value.trim(),

    Designation:
      document.getElementById("designation").value.trim(),

    Area:
      document.getElementById("area").value.trim(),

    Mobile:
      document.getElementById("mobile").value.trim(),

    Email:
      document.getElementById("email").value.trim(),

    Notes:
      document.getElementById("notes").value.trim()

  };


  if (!card.Name && !card.Company) {

    alert("Please enter Name or Company.");

    return;

  }


  const saveButton =
    document.getElementById("saveButton");

  saveButton.disabled = true;

  saveButton.textContent =
    "Uploading...";


  const reader =
    new FileReader();


  reader.onload = function(event) {

    const base64Data =
      event.target.result
        .split(",")[1];


    google.script.run

      .withSuccessHandler(function(newId) {

        alert(
          "Card saved successfully: " +
          newId
        );


        closeAddCard();

        clearAddCardForm();

        loadCards();

        saveButton.disabled = false;

        saveButton.textContent =
          "Save Card";

      })

      .withFailureHandler(function(error) {

        alert(
          "Error: " +
          error.message
        );

        saveButton.disabled = false;

        saveButton.textContent =
          "Save Card";

      })

      .addCard(

        card,

        {
          base64: base64Data
        }

      );

  };


  reader.onerror = function() {

    alert("Unable to read the selected image.");

    saveButton.disabled = false;

    saveButton.textContent =
      "Save Card";

  };


  reader.readAsDataURL(file);

}


/* =================================
   CLEAR ADD CARD FORM
================================= */

function clearAddCardForm() {

  document.getElementById("name").value = "";

  document.getElementById("company").value = "";

  document.getElementById("designation").value = "";

  document.getElementById("area").value = "";

  document.getElementById("mobile").value = "";

  document.getElementById("email").value = "";

  document.getElementById("notes").value = "";

  document.getElementById("imageFile").value = "";

}


/* =================================
   LOAD ALL CARDS ONCE
================================= */

function loadCards() {

  google.script.run

    .withSuccessHandler(function(data) {

      allCards = data;

    })

    .withFailureHandler(function(error) {

      console.error(
        "Loading cards failed:",
        error
      );

    })

    .getCards();

}


/* =================================
   SEARCH LOCALLY
================================= */

function searchCards() {

  const text =
    document
      .getElementById("searchBox")
      .value
      .toLowerCase()
      .trim();


  const results =
    document.getElementById("results");


  if (!text) {

    results.innerHTML = "";

    return;

  }


  const matches =
    allCards.filter(card => {

      return Object
        .values(card)
        .some(value =>
          String(value)
            .toLowerCase()
            .includes(text)
        );

    });


  displayCards(matches);

}


/* =================================
   DISPLAY VISITING CARDS
================================= */

function displayCards(cards) {

  const results =
    document.getElementById("results");


  results.innerHTML = "";


  if (!cards.length) {

    results.innerHTML =
      '<div class="empty">No visiting cards found</div>';

    return;

  }


  cards.forEach(card => {

    if (!card.Image) return;


    const div =
      document.createElement("div");

    div.className = "card";


    const imageName =
      card.Image.trim();


    const imageUrl =
      "https://raw.githubusercontent.com/rajinikanthhc/images/main/visiting-cards/"
      + encodeURIComponent(imageName);


    div.innerHTML = `

      <img
        src="${imageUrl}"
        alt="Visiting Card"
      >

    `;


    results.appendChild(div);

  });

}


/* =================================
   START APP
================================= */

loadCards();

</script>
