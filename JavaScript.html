<script>

let allCards = [];

let editingCardId = null;


/* =================================
   OPEN ADD CARD
================================= */

function openAddCard() {

  editingCardId = null;

  document.getElementById("modalTitle").textContent =
    "Add Visiting Card";

  document.getElementById("saveButton").textContent =
    "Save Card";

  document.getElementById("cardId").style.display =
    "none";

  clearAddCardForm();

  document
    .getElementById("addCardModal")
    .style.display = "flex";

}


/* =================================
   OPEN EDIT CARD
================================= */

function editCard(id) {

  const card =
    allCards.find(item =>
      String(item.ID) === String(id)
    );


  if (!card) {

    alert("Card not found.");

    return;

  }


  editingCardId = card.ID;


  document.getElementById("modalTitle").textContent =
    "Edit Visiting Card";


  document.getElementById("saveButton").textContent =
    "Update Card";


  document.getElementById("cardId").style.display =
    "none";


  document.getElementById("cardId").value =
    card.ID || "";


  document.getElementById("name").value =
    card.Name || "";


  document.getElementById("company").value =
    card.Company || "";


  document.getElementById("designation").value =
    card.Designation || "";


  document.getElementById("area").value =
    card.Area || "";


  document.getElementById("mobile").value =
    card.Mobile || "";


  document.getElementById("email").value =
    card.Email || "";


  document.getElementById("notes").value =
    card.Notes || "";


  document.getElementById("imageFile").value =
    "";


  /* -----------------------------
     SHOW CURRENT IMAGE
  ----------------------------- */

  const currentImage =
    document.getElementById("currentImage");


  if (card.Image) {

    const imageUrl =
      "https://raw.githubusercontent.com/rajinikanthhc/images/main/visiting-cards/"
      + encodeURIComponent(card.Image.trim());


    currentImage.innerHTML = `

      <div class="currentImageText">
        Current photo
      </div>

      <img
        src="${imageUrl}"
        alt="Current Visiting Card"
      >

    `;

  }

  else {

    currentImage.innerHTML = "";

  }


  document
    .getElementById("addCardModal")
    .style.display = "flex";

}


/* =================================
   CLOSE ADD / EDIT CARD
================================= */

function closeAddCard() {

  document
    .getElementById("addCardModal")
    .style.display = "none";

}


/* =================================
   SAVE / UPDATE CARD
================================= */

function saveCard() {

  const fileInput =
    document.getElementById("imageFile");

  const file =
    fileInput.files[0];


  const card = {

    ID:
      document.getElementById("cardId").value.trim(),

    Name:
      document.getElementById("name").value.trim(),

    Company:
      document.getElementById("company").value.trim(),

    Designation:
      document.getElementById("designation").value.trim(),

    Area:
      document.getElementById("area").value.trim(),

    Mobile:
      document.getElementById("mobile").value.trim(),

    Email:
      document.getElementById("email").value.trim(),

    Notes:
      document.getElementById("notes").value.trim()

  };


  /* -----------------------------
     VALIDATION
  ----------------------------- */

  if (!card.Name && !card.Company) {

    alert(
      "Please enter Name or Company."
    );

    return;

  }


  /* -----------------------------
     EDIT EXISTING CARD
  ----------------------------- */

  if (editingCardId) {

    updateExistingCard(
      card,
      file
    );

    return;

  }


  /* -----------------------------
     ADD NEW CARD
  ----------------------------- */

  if (!file) {

    alert(
      "Please select a visiting card PNG image."
    );

    return;

  }


  uploadAndAddCard(
    card,
    file
  );

}


/* =================================
   ADD NEW CARD
================================= */

function uploadAndAddCard(card, file) {

  const saveButton =
    document.getElementById("saveButton");


  saveButton.disabled = true;

  saveButton.textContent =
    "Uploading...";


  const reader =
    new FileReader();


  reader.onload = function(event) {

    const base64Data =
      event.target.result
        .split(",")[1];


    google.script.run

      .withSuccessHandler(function(newId) {

        alert(
          "Card saved successfully: " +
          newId
        );


        closeAddCard();

        clearAddCardForm();

        loadCards();


        saveButton.disabled = false;

        saveButton.textContent =
          "Save Card";

      })


      .withFailureHandler(function(error) {

        alert(
          "Error: " +
          error.message
        );


        saveButton.disabled = false;

        saveButton.textContent =
          "Save Card";

      })


      .addCard(

        card,

        {
          base64: base64Data
        }

      );

  };


  reader.onerror = function() {

    alert(
      "Unable to read the selected image."
    );


    saveButton.disabled = false;

    saveButton.textContent =
      "Save Card";

  };


  reader.readAsDataURL(file);

}


/* =================================
   UPDATE EXISTING CARD
================================= */

function updateExistingCard(card, file) {

  const saveButton =
    document.getElementById("saveButton");


  saveButton.disabled = true;

  saveButton.textContent =
    "Updating...";


  /* -----------------------------
     NO NEW IMAGE
  ----------------------------- */

  if (!file) {

    const existingCard =
      allCards.find(item =>
        String(item.ID) ===
        String(card.ID)
      );


    card.Image =
      existingCard
        ? existingCard.Image
        : "";


    sendCardUpdate(
      card,
      null
    );


    return;

  }


  /* -----------------------------
     NEW IMAGE SELECTED
  ----------------------------- */

  const reader =
    new FileReader();


  reader.onload = function(event) {

    const base64Data =
      event.target.result
        .split(",")[1];


    sendCardUpdate(

      card,

      {
        base64: base64Data
      }

    );

  };


  reader.onerror = function() {

    alert(
      "Unable to read the selected image."
    );


    saveButton.disabled = false;

    saveButton.textContent =
      "Update Card";

  };


  reader.readAsDataURL(file);

}


/* =================================
   SEND UPDATE TO APPS SCRIPT
================================= */

function sendCardUpdate(
  card,
  imageData
) {

  google.script.run

    .withSuccessHandler(function(updatedId) {

      alert(
        "Card updated successfully: " +
        updatedId
      );


      closeAddCard();

      clearAddCardForm();

      loadCards();


      const saveButton =
        document.getElementById("saveButton");


      saveButton.disabled = false;

      saveButton.textContent =
        "Save Card";

    })


    .withFailureHandler(function(error) {

      alert(
        "Error: " +
        error.message
      );


      const saveButton =
        document.getElementById("saveButton");


      saveButton.disabled = false;

      saveButton.textContent =
        "Update Card";

    })


    .updateCard(
      card,
      imageData
    );

}


/* =================================
   CLEAR FORM
================================= */

function clearAddCardForm() {

  document.getElementById("cardId").value =
    "";

  document.getElementById("name").value =
    "";

  document.getElementById("company").value =
    "";

  document.getElementById("designation").value =
    "";

  document.getElementById("area").value =
    "";

  document.getElementById("mobile").value =
    "";

  document.getElementById("email").value =
    "";

  document.getElementById("notes").value =
    "";

  document.getElementById("imageFile").value =
    "";


  document.getElementById("currentImage").innerHTML =
    "";

}


/* =================================
   LOAD ALL CARDS ONCE
================================= */

function loadCards() {

  google.script.run

    .withSuccessHandler(function(data) {

      allCards = data;

    })

    .withFailureHandler(function(error) {

      console.error(
        "Loading cards failed:",
        error
      );

    })

    .getCards();

}


/* =================================
   SEARCH LOCALLY
================================= */

function searchCards() {

  const text =
    document
      .getElementById("searchBox")
      .value
      .toLowerCase()
      .trim();


  const results =
    document.getElementById("results");


  if (!text) {

    results.innerHTML = "";

    return;

  }


  const matches =
    allCards.filter(card => {

      return Object
        .values(card)
        .some(value =>

          String(value)
            .toLowerCase()
            .includes(text)

        );

    });


  displayCards(matches);

}


/* =================================
   DISPLAY VISITING CARDS
================================= */

function displayCards(cards) {

  const results =
    document.getElementById("results");


  results.innerHTML = "";


  if (!cards.length) {

    results.innerHTML =
      '<div class="empty">No visiting cards found</div>';

    return;

  }


  cards.forEach(card => {

    if (!card.Image) return;


    const div =
      document.createElement("div");


    div.className =
      "card";


    const imageName =
      card.Image.trim();


    const imageUrl =
      "https://raw.githubusercontent.com/rajinikanthhc/images/main/visiting-cards/"
      + encodeURIComponent(imageName);


    div.innerHTML = `

      <img
        src="${imageUrl}"
        alt="Visiting Card"
      >

      <button
        class="editButton"
        onclick="editCard('${String(card.ID).replace(/'/g, "\\'")}')"
        title="Edit card">

        ✎

      </button>

    `;


    results.appendChild(div);

  });

}


/* =================================
   START APP
================================= */

loadCards();

</script>
