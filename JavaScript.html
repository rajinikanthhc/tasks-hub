<script>

let allCards = [];


/* =================================
   LOAD ALL CARDS ONCE
================================= */

function loadCards() {

  google.script.run
    .withSuccessHandler(function(data) {

      allCards = data;

    })
    .getCards();

}


/* =================================
   SEARCH LOCALLY
================================= */

function searchCards() {

  const text = document
    .getElementById("searchBox")
    .value
    .toLowerCase()
    .trim();

  const results =
    document.getElementById("results");

  if (!text) {

    results.innerHTML = "";

    return;
  }

  const matches = allCards.filter(card => {

    return Object.values(card).some(value =>
      String(value)
        .toLowerCase()
        .includes(text)
    );

  });

  displayCards(matches);

}


/* =================================
   DISPLAY VISITING CARDS
================================= */

function displayCards(cards) {

  const results =
    document.getElementById("results");

  results.innerHTML = "";

  if (!cards.length) {

    results.innerHTML =
      '<div class="empty">No visiting cards found</div>';

    return;
  }

  cards.forEach(card => {

    if (!card.Image) return;

    const div =
      document.createElement("div");

    div.className = "card";

    const imageName =
      card.Image.trim();

    const imageUrl =
      "https://raw.githubusercontent.com/rajinikanthhc/images/main/visiting-cards/"
      + encodeURIComponent(imageName)
      + ".jpeg";

    div.innerHTML = `
      <img
        src="${imageUrl}"
        alt="Visiting Card"
      >
    `;

    results.appendChild(div);

  });

}


/* =================================
   START APP
================================= */

loadCards();

</script>
