<style>

* {

  box-sizing: border-box;

}


body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background: #f5f6f8;

  color: #222;

}


.app {

  max-width: 800px;

  margin: 0 auto;

  padding: 20px;

}


/* ================================
   HEADER
================================ */

.topbar {

  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 20px;

}


.topbar h1 {

  margin: 0;

  font-size: 28px;

}


.addButton {

  border: none;

  background: #1a73e8;

  color: white;

  padding: 10px 16px;

  border-radius: 7px;

  font-size: 14px;

  cursor: pointer;

}


.addButton:hover {

  background: #1557b0;

}


/* ================================
   SEARCH
================================ */

.searchBox {

  display: flex;

  align-items: center;

  background: white;

  border: 1px solid #ddd;

  border-radius: 8px;

  padding: 0 10px;

  margin-bottom: 15px;

}


.searchBox span {

  margin-right: 8px;

}


.searchBox input {

  flex: 1;

  border: none;

  outline: none;

  padding: 12px 5px;

  font-size: 15px;

}


.searchBox button {

  border: none;

  background: none;

  font-size: 20px;

  cursor: pointer;

  color: #777;

}


/* ================================
   FILTERS
================================ */

.filters {

  display: flex;

  gap: 8px;

  margin-bottom: 15px;

}


.filterButton {

  border: 1px solid #ddd;

  background: white;

  padding: 8px 14px;

  border-radius: 20px;

  cursor: pointer;

}


.filterButton.active {

  background: #1a73e8;

  color: white;

  border-color: #1a73e8;

}


/* ================================
   TASK
================================ */

.task {

  background: white;

  border: 1px solid #e1e1e1;

  border-radius: 8px;

  padding: 13px;

  margin-bottom: 9px;

  display: flex;

  align-items: center;

  gap: 12px;

}


.checkButton {

  width: 22px;

  height: 22px;

  border-radius: 50%;

  border: 2px solid #aaa;

  background: white;

  cursor: pointer;

  flex-shrink: 0;

}


.task.completed .checkButton {

  background: #1a73e8;

  border-color: #1a73e8;

  color: white;

}


.taskInfo {

  flex: 1;

}


.taskName {

  font-size: 15px;

  margin-bottom: 5px;

}


.task.completed .taskName {

  text-decoration: line-through;

  color: #888;

}


.dueDate {

  font-size: 12px;

  color: #777;

}


/* ================================
   TASK ACTIONS
================================ */

.taskActions {

  display: flex;

  align-items: center;

  gap: 8px;

}


.editButton,
.deleteButton {

  border: none;

  background: none;

  font-size: 17px;

  cursor: pointer;

  padding: 3px;

}


.editButton {

  color: #1a73e8;

}


.deleteButton {

  color: #999;

}


.editButton:hover {

  color: #1557b0;

}


.deleteButton:hover {

  color: #d93025;

}


/* ================================
   EMPTY / LOADING
================================ */

.empty {

  text-align: center;

  color: #888;

  padding: 40px 10px;

}


.loading {

  text-align: center;

  color: #888;

  padding: 40px;

}


/* ================================
   MODAL
================================ */

.modal {

  display: none;

  position: fixed;

  inset: 0;

  background: rgba(0, 0, 0, 0.35);

  align-items: center;

  justify-content: center;

  padding: 20px;

}


.modalContent {

  background: white;

  width: 100%;

  max-width: 420px;

  border-radius: 10px;

  padding: 20px;

}


.modalHeader {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 20px;

}


.modalHeader h2 {

  margin: 0;

}


.closeButton {

  border: none;

  background: none;

  font-size: 25px;

  cursor: pointer;

  color: #777;

}


.modalContent label {

  display: block;

  font-size: 13px;

  margin-bottom: 6px;

  margin-top: 12px;

}


.modalContent input {

  width: 100%;

  padding: 11px;

  border: 1px solid #ccc;

  border-radius: 6px;

  font-size: 15px;

}


.saveButton {

  width: 100%;

  border: none;

  background: #1a73e8;

  color: white;

  padding: 11px;

  border-radius: 6px;

  margin-top: 20px;

  cursor: pointer;

  font-size: 15px;

}


.saveButton:disabled {

  opacity: 0.6;

  cursor: not-allowed;

}


/* ================================
   MESSAGE
================================ */

.message {

  position: fixed;

  bottom: 20px;

  left: 50%;

  transform: translateX(-50%);

  background: #333;

  color: white;

  padding: 10px 18px;

  border-radius: 6px;

  display: none;

}


/* ================================
   MOBILE
================================ */

@media (max-width: 600px) {

  .app {

    padding: 12px;

  }


  .topbar h1 {

    font-size: 24px;

  }


  .addButton {

    padding: 9px 12px;

  }


  .task {

    padding: 11px;

  }

}

</style>
