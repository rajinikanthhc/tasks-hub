<script>

let tasks = [];

let currentFilter = "all";


/* ================================
   LOAD TASKS
================================ */

window.onload = function () {

  loadTasks();

};


function loadTasks() {

  const list =
    document.getElementById("taskList");


  list.innerHTML =
    '<div class="loading">Loading tasks...</div>';


  google.script.run

    .withSuccessHandler(function (data) {

      tasks = data || [];

      displayTasks();

    })

    .withFailureHandler(function (error) {

      showMessage(error.message);

    })

    .getTasks();

}


/* ================================
   DISPLAY TASKS
================================ */

function displayTasks() {

  const list =
    document.getElementById("taskList");


  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  let filtered =
    tasks.filter(function (task) {


      /* SEARCH */

      if (
        search &&
        !task.task
          .toLowerCase()
          .includes(search)
      ) {

        return false;

      }


      /* PENDING */

      if (
        currentFilter === "pending" &&
        task.status === "Completed"
      ) {

        return false;

      }


      /* COMPLETED */

      if (
        currentFilter === "completed" &&
        task.status !== "Completed"
      ) {

        return false;

      }


      return true;

    });


  /* ================================
     SORT
  ================================= */

  filtered.sort(function (a, b) {


    const aCompleted =
      a.status === "Completed";


    const bCompleted =
      b.status === "Completed";


    /* COMPLETED ALWAYS LAST */

    if (
      aCompleted &&
      !bCompleted
    ) {

      return 1;

    }


    if (
      !aCompleted &&
      bCompleted
    ) {

      return -1;

    }


    /* CHECK DATE */

    const aHasDate =
      a.dueDate &&
      a.dueDate !== "";


    const bHasDate =
      b.dueDate &&
      b.dueDate !== "";


    /* TASKS WITH DATE FIRST */

    if (
      aHasDate &&
      !bHasDate
    ) {

      return -1;

    }


    if (
      !aHasDate &&
      bHasDate
    ) {

      return 1;

    }


    /* DATE ORDER */

    if (
      aHasDate &&
      bHasDate
    ) {

      if (
        a.dueDate !==
        b.dueDate
      ) {

        return a.dueDate.localeCompare(
          b.dueDate
        );

      }


      /* TIME ORDER */

      if (
        a.time &&
        b.time &&
        a.time !== b.time
      ) {

        return a.time.localeCompare(
          b.time
        );

      }


      if (
        a.time &&
        !b.time
      ) {

        return -1;

      }


      if (
        !a.time &&
        b.time
      ) {

        return 1;

      }

    }


    /* A TO Z */

    return a.task
      .toLowerCase()
      .localeCompare(
        b.task.toLowerCase()
      );

  });


  /* ================================
     EMPTY
  ================================= */

  if (
    filtered.length === 0
  ) {

    list.innerHTML =
      '<div class="empty">No tasks found</div>';

    return;

  }


  /* ================================
     DISPLAY
  ================================= */

  list.innerHTML =
    filtered
      .map(function (task) {


        const completed =
          task.status === "Completed";


        return `

          <div
            class="task ${
              completed
                ? "completed"
                : ""
            }">


            <!-- COMPLETE BUTTON -->

            <button
              class="checkButton"
              onclick="toggleTask(
                ${task.id},
                '${completed
                  ? "Pending"
                  : "Completed"}'
              )">

              ${
                completed
                  ? "✓"
                  : ""
              }

            </button>


            <!-- TASK INFORMATION -->

            <div class="taskInfo">


              <div class="taskName">

                ${
                  escapeHtml(
                    task.task
                  )
                }

              </div>


              ${
                task.dueDate

                  ? `<div class="dueDate">

                       Due:
                       ${formatDate(
                         task.dueDate
                       )}

                       ${
                         task.time
                           ? " at " +
                             formatTime(
                               task.time
                             )
                           : ""
                       }

                     </div>`

                  : ""
              }


            </div>


            <!-- ACTION BUTTONS -->

            <div class="taskActions">


              <button
                class="editButton"
                onclick="openEditTask(${task.id})">

                ✏️

              </button>


              <button
                class="deleteButton"
                onclick="deleteTask(${task.id})">

                🗑

              </button>


            </div>


          </div>

        `;

      })
      .join("");

}


/* ================================
   OPEN ADD TASK
================================ */

function openAddTask() {

  document.getElementById(
    "taskInput"
  ).value = "";


  document.getElementById(
    "dueDateInput"
  ).value = "";


  document.getElementById(
    "timeInput"
  ).value = "";


  document.getElementById(
    "modalTitle"
  ).innerText =
    "Add Task";


  document.getElementById(
    "saveButton"
  ).innerText =
    "Save Task";


  document.getElementById(
    "saveButton"
  ).disabled =
    false;


  document.getElementById(
    "taskModal"
  ).dataset.editId =
    "";


  document.getElementById(
    "taskModal"
  ).style.display =
    "flex";


  setTimeout(function () {

    document
      .getElementById("taskInput")
      .focus();

  }, 100);

}


/* ================================
   OPEN EDIT TASK
================================ */

function openEditTask(id) {

  const task =
    tasks.find(function (item) {

      return String(item.id) ===
        String(id);

    });


  if (!task) {

    showMessage(
      "Task not found."
    );

    return;

  }


  /* TASK */

  document.getElementById(
    "taskInput"
  ).value =
    task.task;


  /* DATE */

  document.getElementById(
    "dueDateInput"
  ).value =
    task.dueDate || "";


  /* TIME */

  document.getElementById(
    "timeInput"
  ).value =
    task.time || "";


  /* TITLE */

  document.getElementById(
    "modalTitle"
  ).innerText =
    "Edit Task";


  /* BUTTON */

  document.getElementById(
    "saveButton"
  ).innerText =
    "Update Task";


  document.getElementById(
    "saveButton"
  ).disabled =
    false;


  /* STORE ID */

  document.getElementById(
    "taskModal"
  ).dataset.editId =
    task.id;


  /* OPEN MODAL */

  document.getElementById(
    "taskModal"
  ).style.display =
    "flex";


  setTimeout(function () {

    document
      .getElementById("taskInput")
      .focus();

  }, 100);

}


/* ================================
   CLOSE ADD / EDIT
================================ */

function closeAddTask() {

  document.getElementById(
    "taskModal"
  ).style.display =
    "none";

}


/* ================================
   SAVE / UPDATE TASK
================================ */

function saveTask() {

  const task =
    document
      .getElementById("taskInput")
      .value
      .trim();


  const dueDate =
    document
      .getElementById("dueDateInput")
      .value;


  const time =
    document
      .getElementById("timeInput")
      .value;


  const modal =
    document.getElementById(
      "taskModal"
    );


  const editId =
    modal.dataset.editId;


  if (!task) {

    showMessage(
      "Please enter a task."
    );

    return;

  }


  const button =
    document.getElementById(
      "saveButton"
    );


  /* ================================
     EDIT TASK
  ================================= */

  if (editId) {

    const taskIndex =
      tasks.findIndex(
        function (item) {

          return String(item.id) ===
            String(editId);

        }
      );


    if (taskIndex === -1) {

      showMessage(
        "Task not found."
      );

      return;

    }


    /* SAVE OLD TASK */

    const oldTask =
      Object.assign(
        {},
        tasks[taskIndex]
      );


    /* ================================
       UPDATE SCREEN IMMEDIATELY
    ================================= */

    tasks[taskIndex] = {

      id: oldTask.id,

      task: task,

      dueDate: dueDate,

      time: time,

      status:
        oldTask.status ||
        "Pending",

      reminderSent: false

    };


    /* CLOSE POPUP */

    closeAddTask();


    /* UPDATE LIST */

    displayTasks();


    showMessage(
      "Task updated"
    );


    /* ================================
       SAVE TO SHEET IN BACKGROUND
    ================================= */

    google.script.run

      .withSuccessHandler(
        function (updatedTask) {

          const index =
            tasks.findIndex(
              function (item) {

                return String(
                  item.id
                ) ===
                String(editId);

              }
            );


          if (index !== -1) {

            tasks[index] =
              updatedTask;

            displayTasks();

          }

        }
      )

      .withFailureHandler(
        function (error) {

          /* RESTORE OLD TASK */

          const index =
            tasks.findIndex(
              function (item) {

                return String(
                  item.id
                ) ===
                String(editId);

              }
            );


          if (index !== -1) {

            tasks[index] =
              oldTask;

            displayTasks();

          }


          showMessage(
            "Update failed: " +
            error.message
          );

        }
      )

      .updateTask(
        editId,
        task,
        dueDate,
        time
      );


    return;

  }


  /* ================================
     ADD TASK
  ================================= */

  button.disabled =
    true;


  button.innerText =
    "Saving...";


  google.script.run

    .withSuccessHandler(
      function (newTask) {

        tasks.push(
          newTask
        );


        closeAddTask();


        button.disabled =
          false;


        button.innerText =
          "Save Task";


        displayTasks();


        showMessage(
          "Task added"
        );

      }
    )

    .withFailureHandler(
      function (error) {

        button.disabled =
          false;


        button.innerText =
          "Save Task";


        showMessage(
          error.message
        );

      }
    )

    .addTask(
      task,
      dueDate,
      time
    );

}


/* ================================
   COMPLETE / UNCOMPLETE
================================ */

function toggleTask(
  id,
  status
) {

  const task =
    tasks.find(
      function (item) {

        return String(
          item.id
        ) ===
        String(id);

      }
    );


  if (!task) {

    return;

  }


  const oldStatus =
    task.status;


  /* UPDATE IMMEDIATELY */

  task.status =
    status;


  displayTasks();


  /* SAVE IN BACKGROUND */

  google.script.run

    .withSuccessHandler(
      function () {

        showMessage(
          status === "Completed"
            ? "Task completed"
            : "Task reopened"
        );

      }
    )

    .withFailureHandler(
      function (error) {

        /* RESTORE */

        task.status =
          oldStatus;


        displayTasks();


        showMessage(
          error.message
        );

      }
    )

    .toggleTask(
      id,
      status
    );

}


/* ================================
   DELETE TASK
================================ */

function deleteTask(id) {

  if (
    !confirm(
      "Delete this task?"
    )
  ) {

    return;

  }


  const index =
    tasks.findIndex(
      function (item) {

        return String(
          item.id
        ) ===
        String(id);

      }
    );


  if (
    index === -1
  ) {

    return;

  }


  const deletedTask =
    tasks[index];


  /* REMOVE IMMEDIATELY */

  tasks.splice(
    index,
    1
  );


  displayTasks();


  /* DELETE IN BACKGROUND */

  google.script.run

    .withSuccessHandler(
      function () {

        showMessage(
          "Task deleted"
        );

      }
    )

    .withFailureHandler(
      function (error) {

        /* RESTORE */

        tasks.splice(
          index,
          0,
          deletedTask
        );


        displayTasks();


        showMessage(
          error.message
        );

      }
    )

    .deleteTask(id);

}


/* ================================
   FILTER
================================ */

function setFilter(
  filter
) {

  currentFilter =
    filter;


  document
    .querySelectorAll(
      ".filterButton"
    )
    .forEach(
      function (button) {

        button.classList.remove(
          "active"
        );

      }
    );


  if (
    filter === "all"
  ) {

    document
      .getElementById(
        "allButton"
      )
      .classList.add(
        "active"
      );

  }


  if (
    filter === "pending"
  ) {

    document
      .getElementById(
        "pendingButton"
      )
      .classList.add(
        "active"
      );

  }


  if (
    filter === "completed"
  ) {

    document
      .getElementById(
        "completedButton"
      )
      .classList.add(
        "active"
      );

  }


  displayTasks();

}


/* ================================
   SEARCH
================================ */

function filterTasks() {

  const value =
    document
      .getElementById(
        "searchInput"
      )
      .value;


  document
    .getElementById(
      "clearSearch"
    )
    .style.display =
      value
        ? "block"
        : "none";


  displayTasks();

}


/* ================================
   CLEAR SEARCH
================================ */

function clearSearch() {

  document
    .getElementById(
      "searchInput"
    )
    .value = "";


  document
    .getElementById(
      "clearSearch"
    )
    .style.display =
      "none";


  displayTasks();

}


/* ================================
   FORMAT DATE
================================ */

function formatDate(
  dateString
) {

  const parts =
    dateString.split("-");


  if (
    parts.length !== 3
  ) {

    return dateString;

  }


  return (

    parts[2] +
    "-" +
    parts[1] +
    "-" +
    parts[0]

  );

}


/* ================================
   FORMAT TIME
================================ */

function formatTime(
  timeString
) {

  if (!timeString) {

    return "";

  }


  const parts =
    timeString.split(":");


  if (
    parts.length < 2
  ) {

    return timeString;

  }


  let hour =
    parseInt(
      parts[0],
      10
    );


  const minute =
    parts[1];


  const ampm =
    hour >= 12
      ? "PM"
      : "AM";


  hour =
    hour % 12 ||
    12;


  return (
    hour +
    ":" +
    minute +
    " " +
    ampm
  );

}


/* ================================
   ESCAPE HTML
================================ */

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


/* ================================
   MESSAGE
================================ */

function showMessage(
  text
) {

  const message =
    document.getElementById(
      "message"
    );


  message.innerText =
    text;


  message.style.display =
    "block";


  setTimeout(
    function () {

      message.style.display =
        "none";

    },
    2500
  );

}


/* ================================
   CLOSE MODAL OUTSIDE
================================ */

document.addEventListener(
  "click",
  function (event) {

    const modal =
      document.getElementById(
        "taskModal"
      );


    if (
      event.target === modal
    ) {

      closeAddTask();

    }

  }
);

</script>
